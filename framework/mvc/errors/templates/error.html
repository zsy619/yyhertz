<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <title>%d -- 错误提示</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        :root {
            --bg: #f6f8fa;
            --fg: #2d3748;
            --accent: #e53e3e;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--fg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
        }

        .card {
            max-width: 480px;
            width: 100%;
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .08);
            padding: 2.5rem 2rem 3rem;
        }

        .icon {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: .75rem;
        }

        h1 {
            font-size: 2.75rem;
            font-weight: 700;
            margin-bottom: .25rem;
            color: var(--accent);
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }

        p {
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #4a5568;
        }

        a.button {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: .75rem 1.75rem;
            border-radius: .6rem;
            text-decoration: none;
            font-weight: 600;
            transition: .2s;
        }

        a.button:hover {
            background: #c53030
        }

        @media(max-width:600px) {
            .icon {
                font-size: 3rem
            }

            h1 {
                font-size: 2.25rem
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon" id="icon">⚠️</div>
        <h1 id="code">404</h1>
        <h2 id="title">页面不存在</h2>
        <p id="desc">您访问的页面可能已被删除或暂时不可用。</p>
        <a class="button" href="/">返回首页</a>
    </div>
    <script>
        const map = {
            400: { icon: "⚠️", title: "请求错误", desc: "服务器无法理解您的请求，请检查参数。" },
            401: { icon: "🔒", title: "未授权", desc: "您需要先登录或提供有效凭证。" },
            402: { icon: "💳", title: "需要付费", desc: "此资源需要付费后才能访问。" },
            403: { icon: "🚫", title: "禁止访问", desc: "服务器拒绝执行，权限不足。" },
            404: { icon: "🕵️", title: "页面不存在", desc: "您访问的链接已失效或从未存在。" },
            405: { icon: "🛠️", title: "方法不被允许", desc: "请求方式（GET/POST 等）不被支持。" },
            406: { icon: "📄", title: "无法接受", desc: "服务器无法返回符合要求的内容格式。" },
            408: { icon: "⏱️", title: "请求超时", desc: "服务器等待请求超时，请稍后重试。" },
            409: { icon: "⚔️", title: "资源冲突", desc: "当前状态与请求冲突，无法完成操作。" },
            410: { icon: "🗑️", title: "资源已永久删除", desc: "该资源已被永久删除且不再可用。" },
            413: { icon: "📦", title: "请求实体过大", desc: "上传的文件或数据超出服务器限制。" },
            415: { icon: "📼", title: "不支持的媒体类型", desc: "服务器不支持请求中的媒体格式。" },
            418: { icon: "🫖", title: "我是一个茶壶", desc: "彩蛋：服务器拒绝冲泡咖啡，因为它是茶壶。" },
            422: { icon: "🧩", title: "无法处理的实体", desc: "请求格式正确，但语义错误。" },
            429: { icon: "🚦", title: "请求过于频繁", desc: "请降低频率后稍候再试。" },
            500: { icon: "💥", title: "服务器内部错误", desc: "服务器遇到了未知错误，无法完成请求。" },
            501: { icon: "🚧", title: "尚未实现", desc: "服务器不支持完成此请求所需的功能。" },
            502: { icon: "🌉", title: "网关错误", desc: "上游服务器返回无效响应。" },
            503: { icon: "🛠️", title: "服务暂不可用", desc: "服务器正在维护或过载，请稍后重试。" },
            504: { icon: "🕓", title: "网关超时", desc: "网关等待上游服务器响应超时。" },
            505: { icon: "🔄", title: "HTTP 版本不受支持", desc: "服务器不支持请求中的 HTTP 协议版本。" }
        };

        const code = new URLSearchParams(location.search).get('code') || '%d';
        const info = map[code] || map['%d'];
        document.getElementById('icon').textContent = info.icon;
        document.getElementById('code').textContent = code;
        document.getElementById('title').textContent = info.title;
        document.getElementById('desc').textContent = info.desc;
    </script>
</body>

</html>
