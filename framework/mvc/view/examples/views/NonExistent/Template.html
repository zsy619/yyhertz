<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模板不存在 - 错误页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffa502 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            padding: 50px 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: slideUp 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .error-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff6b6b, #ffa502, #ff6b6b);
            animation: gradientMove 3s linear infinite;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 200% 50%;
            }
        }

        .error-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            color: #ff6b6b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #ff6b6b;
            margin-bottom: 10px;
            line-height: 1;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .error-title {
            font-size: 2rem;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .error-message {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-details {
            background: #fff5f5;
            border-left: 4px solid #ff6b6b;
            padding: 15px 20px;
            margin: 25px 0;
            text-align: left;
            border-radius: 0 8px 8px 0;
        }

        .error-details h4 {
            color: #ff6b6b;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .error-details p {
            color: #777;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e9ecef;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary:hover {
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .support-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #888;
            font-size: 0.9rem;
        }

        .support-info a {
            color: #667eea;
            text-decoration: none;
        }

        .support-info a:hover {
            text-decoration: underline;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .error-container {
                padding: 40px 30px;
                margin: 15px;
            }

            .error-code {
                font-size: 4rem;
            }

            .error-title {
                font-size: 1.7rem;
            }

            .error-message {
                font-size: 1rem;
            }

            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .error-container {
                padding: 30px 20px;
            }

            .error-icon {
                font-size: 4rem;
            }

            .error-code {
                font-size: 3rem;
            }

            .error-title {
                font-size: 1.5rem;
            }

            .error-message {
                font-size: 0.95rem;
            }

            .error-details {
                padding: 12px 15px;
            }

            .error-details h4 {
                font-size: 0.9rem;
            }

            .error-details p {
                font-size: 0.85rem;
            }
        }

        /* 加载动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .error-container {
            animation: fadeIn 0.6s ease-in;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-icon">📁</div>
        <div class="error-code">TPL-404</div>
        <h1 class="error-title">模板文件不存在</h1>
        <p class="error-message">
            抱歉，系统无法找到您请求的模板文件。<br>
            这可能是由于模板已被删除、移动或文件名错误导致的。
        </p>
        <div class="error-details">
            <h4>可能的原因：</h4>
            <p>• 模板文件已被删除或重命名<br>
                • 模板路径配置错误<br>
                • 权限设置问题导致无法访问<br>
                • 缓存问题导致模板未正确加载</p>
        </div>
        <div class="action-buttons">
            <a href="/" class="btn btn-primary">🏠 返回首页</a>
            <a href="javascript:history.back()" class="btn btn-secondary">⬅️ 返回上页</a>
            <a href="/templates" class="btn btn-secondary">📋 模板列表</a>
        </div>
        <div class="support-info">
            如果问题持续存在，请联系技术支持：<a href="mailto:support@example.com">support@example.com</a>
        </div>
    </div>
</body>

</html>
