{{define "test/partials/comparison_card.html"}}
<div style="text-align: center;">
    <div style="background: {{.color}}; color: white; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
        <div style="font-size: 2em; margin-bottom: 10px;">
            {{if eq .method "Include"}}📄{{else}}📋{{end}}
        </div>
        <h6 style="margin: 0 0 10px 0;">{{.method}} 函数</h6>
        <code style="background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 3px; font-size: 0.9em;">
            {{.syntax}}
        </code>
    </div>
    <div style="color: {{.color}}; font-weight: 600; font-size: 0.9em;">
        功能完全相同 ✓
    </div>
    <div style="margin-top: 10px; padding: 8px; background: #f8f9fa; border-radius: 5px; font-size: 0.85em; color: #6c757d;">
        渲染方法: {{.method}}
    </div>
</div>
{{end}}
