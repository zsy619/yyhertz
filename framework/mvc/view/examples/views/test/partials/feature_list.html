<div style="background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px;">
    <h5 style="color: #495057; margin: 0 0 15px 0; display: flex; align-items: center; gap: 8px;">
        🚀 {{.title | default "功能列表"}}
    </h5>
    <ul style="list-style: none; margin: 0; padding: 0;">
        {{range $index, $feature := .features}}
        <li style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #e9ecef;">
            <span style="background: #28a745; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;">
                {{add $index 1}}
            </span>
            <span style="color: #495057;">{{$feature}}</span>
        </li>
        {{end}}
    </ul>
    <div style="margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 5px; font-size: 0.9em; color: #6c757d;">
        ✅ 功能列表通过 <code>template "test/partials/feature_list.html"</code> 渲染，共 {{len .features}} 项功能
    </div>
</div>
