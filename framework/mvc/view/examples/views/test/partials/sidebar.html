<div style="background: #2c3e50; color: white; height: 100%; border-radius: 8px; overflow: hidden;">
    <div style="padding: 20px; background: #34495e; border-bottom: 1px solid #4a5f7a;">
        <h5 style="margin: 0; display: flex; align-items: center; gap: 10px;">
            🧭 导航菜单
        </h5>
    </div>
    <nav style="padding: 0;">
        {{range .}}
        <a href="{{.url}}" style="
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 15px 20px; 
            color: #ecf0f1; 
            text-decoration: none; 
            border-bottom: 1px solid #34495e;
            transition: background 0.3s ease;
        " onmouseover="this.style.background='#34495e'" onmouseout="this.style.background='transparent'">
            <span style="font-size: 1.2em;">{{.icon}}</span>
            <span>{{.title}}</span>
        </a>
        {{end}}
    </nav>
    <div style="padding: 15px 20px; margin-top: auto; background: #1a252f; font-size: 0.85em; opacity: 0.8;">
        ✅ 侧边栏通过<br><code>partial "test/partials/sidebar.html"</code><br>渲染
    </div>
</div>
