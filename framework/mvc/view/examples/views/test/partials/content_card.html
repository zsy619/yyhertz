<div style="background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin: 10px 0;">
    <h5 style="color: #495057; margin: 0 0 15px 0;">📄 数据卡片</h5>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
        <div>
            <strong>名称:</strong> {{.name | default "未设置"}}
        </div>
        <div>
            <strong>描述:</strong> {{.description | default "暂无描述"}}
        </div>
        <div>
            <strong>时间:</strong> {{dateformat .timestamp "2006-01-02 15:04:05"}}
        </div>
    </div>
    <div style="margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 5px; font-size: 0.9em;">
        ✅ 此卡片通过 <code>include "test/partials/content_card.html"</code> 渲染，数据来源：<code>.TestData</code>
    </div>
</div>
