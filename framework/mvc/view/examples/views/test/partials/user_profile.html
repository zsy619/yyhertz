<div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; margin: 10px 0;">
    <div style="display: flex; align-items: center; gap: 15px;">
        <div style="width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px;">
            👤
        </div>
        <div style="flex: 1;">
            <h4 style="margin: 0 0 5px 0; font-size: 1.3em;">{{.username | default "访客用户"}}</h4>
            <div style="opacity: 0.9; font-size: 0.95em;">
                <div>角色: {{.role | default "普通用户"}}</div>
                <div>头像: {{.avatar | default "默认头像"}}</div>
            </div>
        </div>
        <div style="background: rgba(255,255,255,0.2); padding: 8px 12px; border-radius: 20px; font-size: 0.85em;">
            在线
        </div>
    </div>
    <div style="margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; font-size: 0.9em;">
        ✅ 此用户资料卡通过 <code>template "test/partials/user_profile.html"</code> 渲染
    </div>
</div>
