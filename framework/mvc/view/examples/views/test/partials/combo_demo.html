<div style="background: white; border: 2px solid {{.color}}; border-radius: 8px; padding: 15px;">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
        <div style="background: {{.color}}; color: white; padding: 6px 10px; border-radius: 15px; font-size: 0.8em; font-weight: 600;">
            {{.method}}
        </div>
        <span style="color: {{.color}}; font-weight: 500;">函数演示</span>
    </div>
    
    <div style="margin-bottom: 15px;">
        <h6 style="color: #2c3e50; margin: 0 0 8px 0;">标题:</h6>
        <p style="margin: 0; color: #495057;">{{.data.title | default "示例标题"}}</p>
    </div>
    
    <div style="margin-bottom: 15px;">
        <h6 style="color: #2c3e50; margin: 0 0 8px 0;">面包屑导航:</h6>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            {{range .data.breadcrumb}}
            <span style="background: #e9ecef; padding: 4px 8px; border-radius: 12px; font-size: 0.85em; color: #6c757d;">
                {{.}}
            </span>
            {{end}}
        </div>
    </div>
    
    <div style="background: rgba({{if eq .method "Include"}}52,152,219{{else}}142,68,173{{end}},0.1); padding: 10px; border-radius: 5px; font-size: 0.85em; color: {{.color}};">
        ✅ 通过 <strong>{{.method}}</strong> 函数渲染
    </div>
</div>
