<div style="background: white; border: 1px solid #dee2e6; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <div style="background: #f8f9fa; padding: 15px; border-bottom: 1px solid #dee2e6;">
        <h6 style="margin: 0; color: #495057; display: flex; align-items: center; gap: 8px;">
            📊 用户数据表格
        </h6>
    </div>
    <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background: #f1f3f4;">
                    <th style="padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6; color: #495057; font-weight: 600;">ID</th>
                    <th style="padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6; color: #495057; font-weight: 600;">姓名</th>
                    <th style="padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6; color: #495057; font-weight: 600;">邮箱</th>
                    <th style="padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6; color: #495057; font-weight: 600;">状态</th>
                </tr>
            </thead>
            <tbody>
                {{range .}}
                <tr style="border-bottom: 1px solid #e9ecef;" onmouseover="this.style.background='#f8f9fa'" onmouseout="this.style.background='white'">
                    <td style="padding: 12px; color: #6c757d;">{{.id}}</td>
                    <td style="padding: 12px; color: #495057; font-weight: 500;">{{.name}}</td>
                    <td style="padding: 12px; color: #6c757d;">{{.email}}</td>
                    <td style="padding: 12px;">
                        {{if eq .status "active"}}
                            <span style="background: #d4edda; color: #155724; padding: 4px 8px; border-radius: 12px; font-size: 0.85em; font-weight: 500;">
                                ✅ 活跃
                            </span>
                        {{else}}
                            <span style="background: #f8d7da; color: #721c24; padding: 4px 8px; border-radius: 12px; font-size: 0.85em; font-weight: 500;">
                                ❌ 不活跃
                            </span>
                        {{end}}
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
    <div style="padding: 12px 15px; background: #f8f9fa; border-top: 1px solid #dee2e6; font-size: 0.9em; color: #6c757d;">
        ✅ 表格数据通过 <code>partial "test/partials/data_table.html"</code> 渲染，共 {{len .}} 条记录
    </div>
</div>
