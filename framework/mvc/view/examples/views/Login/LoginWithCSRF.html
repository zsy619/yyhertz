<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>安全登录 - CSRF保护</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            animation: slideIn 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 200% 50%;
            }
        }

        .security-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #4ade80;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 8px rgba(74, 222, 128, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-header h1 {
            color: #333;
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
        }

        .security-info {
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #374151;
        }

        .security-info strong {
            color: #1d4ed8;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            text-align: left;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .csrf-token {
            background: #f3f4f6;
            border: 2px dashed #d1d5db;
            padding: 15px;
            border-radius: 8px;
            margin: 25px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #6b7280;
            text-align: center;
            word-break: break-all;
        }

        .csrf-token-label {
            display: block;
            margin-bottom: 8px;
            color: #6b7280;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-me input {
            width: auto;
        }

        .remember-me label {
            color: #555;
            cursor: pointer;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .forgot-password:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .login-button:hover::before {
            left: 100%;
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
            color: #9ca3af;
            font-size: 0.95rem;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #e5e7eb, transparent);
            z-index: 1;
        }

        .divider span {
            background: white;
            position: relative;
            z-index: 2;
            padding: 0 15px;
        }

        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .social-btn:hover {
            border-color: #667eea;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .signup-link {
            text-align: center;
            font-size: 1rem;
            color: #666;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .signup-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .error-message {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            color: #dc2626;
            font-size: 0.9rem;
            display: none;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .login-container {
                padding: 40px 30px;
                margin: 15px;
            }

            .login-header h1 {
                font-size: 1.8rem;
            }

            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .social-login {
                flex-direction: column;
                gap: 12px;
            }

            .security-badge {
                position: static;
                display: inline-flex;
                margin-bottom: 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .login-container {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 1.6rem;
            }

            .login-header p {
                font-size: 0.9rem;
            }

            .form-group input {
                padding: 12px 12px;
                font-size: 1rem;
            }

            .login-button {
                padding: 12px;
                font-size: 1rem;
            }

            .social-btn {
                padding: 10px;
                font-size: 0.9rem;
            }
        }

        /* 加载状态 */
        .login-button.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .login-button.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .login-button .btn-text {
            transition: opacity 0.3s ease;
        }

        .login-button.loading .btn-text {
            opacity: 0;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="security-badge">
            🔐 CSRF保护
        </div>
        <div class="login-header">
            <h1>用户登录 {{.username}}</h1>
            <p>{{.message}}</p>
        </div>
        <div class="error-message" id="errorMessage">
            用户名或密码错误，请重试。
        </div>
        <div class="security-info">
            <strong>安全提示：</strong>本页面已启用CSRF保护，确保您的登录请求安全可靠。
        </div>
        <form id="loginForm" method="POST" action="/login">
            <!-- CSRF Token -->
            <input type="hidden" name="csrf_token" value="csrf-token-placeholder">
            <div class="form-group">
                <label for="username">用户名:</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名或邮箱" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码:</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
            </div>
            <div class="form-group">
                <label for="username">CSRF Token 测试:</label>
                <input type="hidden" name="csrf_token" value="real-csrf-token-12345">
            </div>
            <div class="csrf-token">
                <span class="csrf-token-label">CSRF令牌</span>
                abc123xyz789def456
            </div>
            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">记住我</label>
                </div>
                <a href="#" class="forgot-password">忘记密码？</a>
            </div>
            <button type="submit" class="login-button" id="loginButton">
                <span class="btn-text">安全登录</span>
            </button>
        </form>
        <div class="divider">
            <span>或使用其他方式登录</span>
        </div>
        <div class="social-login">
            <button class="social-btn" onclick="socialLogin('wechat')">
                微信登录
            </button>
            <button class="social-btn" onclick="socialLogin('qq')">
                QQ登录
            </button>
        </div>
        <div class="signup-link">
            还没有账户？<a href="/register">立即注册</a>
        </div>
    </div>
    <script>
        // 防止重复提交和添加加载状态
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            const button = document.getElementById('loginButton');
            const originalText = button.querySelector('.btn-text').textContent;

            // 添加加载状态
            button.classList.add('loading');

            // 模拟提交延迟（实际项目中应该移除）
            setTimeout(() => {
                button.classList.remove('loading');
            }, 2000);
        });

        // 社交登录模拟
        function socialLogin(provider) {
            alert(`正在跳转到${provider === 'wechat' ? '微信' : 'QQ'}登录页面...`);
        }

        // 显示错误消息示例（实际项目中由后端控制）
        // document.getElementById('errorMessage').style.display = 'block';
    </script>
</body>

</html>
