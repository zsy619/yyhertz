<!-- 博客页面专用 HTML Head -->
<meta name="description" content="YYHertz 技术博客 - 分享 Go 框架开发经验和最佳实践">
<meta name="keywords" content="YYHertz,Go框架,Web开发,MVC,模板引擎,性能优化">
<meta name="author" content="YYHertz 开发团队">

<!-- Open Graph Meta -->
<meta property="og:title" content="YYHertz 技术博客">
<meta property="og:description" content="专业的 Go Web 框架技术分享平台">
<meta property="og:type" content="website">
<meta property="og:url" content="/blogs">

<!-- 博客专用样式 -->
<style>
    /* 博客页面增强样式 */
    .blog-header-enhanced {
        position: relative;
        overflow: hidden;
    }
    
    .blog-header-enhanced::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="40" r="3" fill="rgba(255,255,255,0.1)"/><circle cx="40" cy="80" r="2" fill="rgba(255,255,255,0.1)"/></svg>');
        animation: float 20s infinite linear;
    }
    
    @keyframes float {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(100px); }
    }
    
    /* 文章卡片增强动画 */
    .article-card {
        position: relative;
        overflow: hidden;
    }
    
    .article-card::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(45deg, #667eea, #764ba2, #667eea);
        z-index: -1;
        border-radius: 10px;
        opacity: 0;
        transition: opacity 0.3s;
    }
    
    .article-card:hover::before {
        opacity: 1;
    }
    
    /* 响应式字体大小 */
    @media (max-width: 768px) {
        .header h1 {
            font-size: 2rem;
        }
        .article-title {
            font-size: 1.2rem;
        }
    }
    
    /* 深色模式支持 */
    @media (prefers-color-scheme: dark) {
        .article-card {
            background: #2d3748;
            border-color: #4a5568;
            color: #e2e8f0;
        }
        
        .article-title {
            color: #f7fafc;
        }
        
        .blog-intro {
            background: #2d3748;
            color: #cbd5e0;
        }
    }
    
    /* 打印样式 */
    @media print {
        .sidebar-area,
        .pagination,
        .read-more {
            display: none !important;
        }
        
        .main-layout {
            grid-template-columns: 1fr !important;
        }
        
        .article-card {
            break-inside: avoid;
            box-shadow: none;
            border: 1px solid #000;
        }
    }
</style>

<!-- 博客功能脚本 -->
<script>
    // 预加载关键资源
    document.addEventListener('DOMContentLoaded', function() {
        // 图片懒加载支持
        if ('IntersectionObserver' in window) {
            const imageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        img.classList.remove('lazy');
                        imageObserver.unobserve(img);
                    }
                });
            });
            
            document.querySelectorAll('img[data-src]').forEach(img => {
                imageObserver.observe(img);
            });
        }
        
        // 平滑滚动支持
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    });
</script>
