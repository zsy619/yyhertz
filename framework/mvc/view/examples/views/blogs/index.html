<div class="blog-list">
    <h2>{{.PageTitle}}</h2>
    <p class="blog-intro">欢迎来到 YYHertz 技术博客，这里分享最新的框架使用技巧和开发经验。</p>

    <div class="articles-grid">
        {{range .Articles}}
        <article class="article-card">
            <div class="article-header">
                <h3 class="article-title">{{.Title}}</h3>
                <div class="article-meta">
                    <span class="author">👤 {{.Author}}</span>
                    <span class="date">📅 {{.Date}}</span>
                </div>
            </div>
            
            <div class="article-content">
                <p class="article-summary">{{.Summary}}</p>
            </div>
            
            <div class="article-footer">
                <div class="tags">
                    {{range .Tags}}
                    <span class="tag">{{.}}</span>
                    {{end}}
                </div>
                <a href="#" class="read-more">阅读更多 →</a>
            </div>
        </article>
        {{end}}
    </div>
    
    <div class="pagination">
        <a href="#" class="page-btn">← 上一页</a>
        <span class="page-info">第 1 页 / 共 5 页</span>
        <a href="#" class="page-btn">下一页 →</a>
    </div>
</div>

<style>
    .blog-intro {
        color: #666;
        font-size: 1.1rem;
        margin: 1rem 0 2rem;
        padding: 1rem;
        background: #f8f9fa;
        border-radius: 5px;
        border-left: 4px solid #667eea;
    }

    .articles-grid {
        display: grid;
        gap: 1.5rem;
        margin: 2rem 0;
    }

    .article-card {
        border: 1px solid #e9ecef;
        border-radius: 8px;
        padding: 1.5rem;
        background: #fff;
        transition: all 0.3s ease;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .article-card:hover {
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        transform: translateY(-2px);
    }

    .article-header {
        margin-bottom: 1rem;
    }

    .article-title {
        color: #2c3e50;
        font-size: 1.4rem;
        margin-bottom: 0.5rem;
        line-height: 1.4;
    }

    .article-title:hover {
        color: #667eea;
        cursor: pointer;
    }

    .article-meta {
        display: flex;
        gap: 1rem;
        color: #666;
        font-size: 0.9rem;
    }

    .article-content {
        margin: 1rem 0;
    }

    .article-summary {
        color: #555;
        line-height: 1.6;
    }

    .article-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid #eee;
    }

    .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
    }

    .tag {
        background: #e3f2fd;
        color: #1976d2;
        padding: 0.2rem 0.6rem;
        border-radius: 12px;
        font-size: 0.8rem;
        text-decoration: none;
    }

    .read-more {
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s;
    }

    .read-more:hover {
        color: #5a67d8;
    }

    .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 2rem 0;
        padding: 1rem;
        background: #f8f9fa;
        border-radius: 8px;
    }

    .page-btn {
        background: #667eea;
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 5px;
        text-decoration: none;
        transition: background 0.3s;
    }

    .page-btn:hover {
        background: #5a67d8;
    }

    .page-info {
        color: #666;
        font-weight: 500;
    }

    @media (max-width: 768px) {
        .article-footer {
            flex-direction: column;
            gap: 1rem;
            align-items: flex-start;
        }
        
        .pagination {
            flex-direction: column;
            gap: 1rem;
        }
    }
</style>
