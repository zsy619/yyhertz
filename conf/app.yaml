# YYHertz Framework Configuration
# 配置文件格式: YAML

# 应用基础配置
app:
  name: "YYHertz"
  version: "1.0.0"
  environment: "development"  # development, testing, production
  debug: true
  port: 8888
  host: "0.0.0.0"
  timezone: "Asia/Shanghai"

# 站点信息配置
site:
  name: "YYHertz"          # 站点名称，用于页面标题等
  version: "1.0.0"            # 站点版本号，用于版本管理和缓存控制
  title: "YYHertz - 高性能Go Web框架"  # 完整的站点标题
  description: "YYHertz是一个基于Go语言的高性能Web开发框架"  # 站点描述，用于SEO
  keywords:                   # SEO关键词列表
    - "Go"
    - "Web框架"
    - "高性能"
    - "YYHertz"
  domain: "localhost"         # 主域名，用于生成绝对链接
  url: "http://localhost:6060"  # 完整的站点URL
  language: "zh-CN"           # 语言设置，用于国际化
  locale: "zh_CN"             # 区域设置，更具体的本地化
  favicon: "/static/favicon.ico"  # 网站图标文件路径
  logo: "/static/logo.png"    # 网站Logo文件路径
  copyright: "© 2025 YYHertz. All rights reserved."  # 版权信息
  icp: ""                     # ICP备案号，中国网站必需
  analytics: ""               # 统计代码，如Google Analytics

# 日志配置
log:
  level: "info"          # debug, info, warn, error, fatal, panic
  format: "json"         # json, text
  enable_console: true
  enable_file: false
  file_path: "./logs/app.log"
  max_size: 100          # MB
  max_age: 7            # 天
  max_backups: 10
  compress: true
  show_caller: true
  show_timestamp: true

# TLS配置
tls:
  enable: false
  cert_file: ""
  key_file: ""
  min_version: "1.2"
  max_version: "1.3"
  auto_reload: false
  reload_interval: 300

# 中间件配置
middleware:
  # CORS跨域配置
  cors:
    enable: true
    allow_origins: ["*"]
    allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allow_headers: ["*"]
    expose_headers: []
    allow_credentials: false
    max_age: 3600

  # 限流配置
  rate_limit:
    enable: false
    rate: 100              # 请求/秒
    burst: 200             # 突发容量
    strategy: "token_bucket"  # token_bucket, sliding_window


# 外部服务配置
services:
  # 邮件服务
  email:
    provider: "smtp"       # smtp, sendgrid, ses
    host: "smtp.gmail.com"
    port: 587
    username: ""
    password: ""
    from: "noreply@example.com"

  # 文件存储
  storage:
    provider: "local"      # local, s3, oss
    local_path: "./uploads"
    bucket: ""
    region: ""
    access_key: ""
    secret_key: ""
    cdn_domain: ""

# 监控配置
monitor:
  enable: false
  endpoint: "/metrics"
  interval: 30          # 秒
  timeout: 10           # 秒
