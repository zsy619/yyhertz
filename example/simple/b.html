<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - 可视化数据看板设计器 (拖拽优化版)</title>
    <!-- 引入 Layui CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.13/css/layui.css" />
    <!-- 引入 jQuery UI CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/themes/base/jquery-ui.min.css" />
    <!-- 引入 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        body,
        html {
            overflow: hidden;
            background-color: #f2f2f2;
        }

        /* --- 整体布局 --- */
        .layui-header {
            background-color: #fff;
            box-shadow: 0 1px 4px rgba(0, 21, 41, .08);
            z-index: 1001;
        }

        .layui-side {
            top: 60px;
            box-shadow: 2px 0 6px rgba(0, 21, 41, .35);
            z-index: 1000;
        }

        .properties-panel {
            position: fixed;
            top: 60px;
            right: 0;
            width: 320px;
            height: calc(100vh - 60px);
            background-color: #fff;
            border-left: 1px solid #e6e6e6;
            padding: 20px;
            overflow-y: auto;
            z-index: 1000;
        }

        .layui-body {
            top: 60px;
            left: 220px;
            right: 320px;
            bottom: 0;
            padding: 15px;
            overflow: auto;
        }

        /* --- 左侧组件库 --- */
        .component-group-title {
            font-weight: bold;
            color: #333;
            margin: 15px 0 5px 15px;
            font-size: 14px;
        }

        .component-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 0 10px;
        }

        .component-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 5px;
            cursor: grab;
            border: 1px solid #eee;
            border-radius: 4px;
            background-color: #fafafa;
            transition: all 0.2s ease-in-out;
        }

        .component-item:hover {
            background-color: #eef5ff;
            border-color: #1E9FFF;
        }

        .component-item i {
            font-size: 24px;
            color: #1E9FFF;
        }

        .component-item span {
            font-size: 12px;
            margin-top: 8px;
            color: #666;
        }

        /* 折叠面板样式 */
        .layui-collapse {
            border: none;
        }

        .layui-colla-item {
            margin-bottom: 10px;
        }

        .layui-colla-title {
            background-color: #f8f8f8;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
        }
        
        .layui-colla-title::after {
            content: "\e61a";
            font-family: layui-icon !important;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            transition: all 0.3s;
        }
        
        .layui-colla-item.layui-colla-itemed .layui-colla-title::after {
            transform: translateY(-50%) rotate(180deg);
        }

        .layui-colla-content {
            border: 1px solid #eee;
            border-top: none;
            border-radius: 0 0 4px 4px;
            padding: 10px 0;
        }

        /* --- 中央画布与组件 --- */
        #dashboard-canvas {
            width: 1920px;
            height: 1080px;
            background-color: #fff;
            background-image: linear-gradient(rgba(0, 0, 0, .04) 1px, transparent 0), linear-gradient(90deg, rgba(0, 0, 0, .04) 1px, transparent 0);
            background-size: 20px 20px;
            position: relative;
            transform-origin: top left;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .chart-widget {
            position: absolute;
            border: 1px solid #ddd;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            overflow: visible;
        }

        .chart-widget.selected {
            border: 2px solid #1E9FFF !important;
            box-shadow: 0 0 10px rgba(30, 159, 255, 0.5);
            z-index: 999 !important;
        }

        .widget-delete-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 20px;
            height: 20px;
            background-color: red;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 20px;
            cursor: pointer;
            display: none;
            z-index: 1000;
        }

        .chart-widget.selected .widget-delete-btn {
            display: block;
        }

        .chart-widget-header {
            padding: 0 10px;
            line-height: 38px;
            font-weight: 600;
            border-bottom: 1px solid #f6f6f6;
            background-color: #fff;
            cursor: move;
        }

        .chart-widget-body {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
            cursor: default;
        }

        .ui-resizable-handle {
            background-color: #1E9FFF;
            opacity: 0.7;
        }

        /* 拖拽辅助元素的样式 */
        .ui-draggable-helper {
            opacity: 0;
            border: none;
        }
        /* --- 基础组件 & 表格样式 --- */
        .widget-basic-component {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        .widget-basic-component.layui-btn {
            height: 100% !important;
        }

        .widget-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .layui-table,
        .layui-table-view {
            margin: 0;
        }

        .layui-table-cell .layui-icon {
            vertical-align: middle;
        }

        /* --- 右侧属性面板 --- */
        .properties-panel .section-title {
            font-size: 14px;
            font-weight: 600;
            margin: 20px 0 15px;
            padding-left: 10px;
            border-left: 3px solid #1E9FFF;
        }

        .position-size-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-gap: 10px;
        }

        /* --- 缩放控制按钮样式 --- */
        #zoom-level {
            display: inline-block;
            width: 40px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }

        /* --- 滚动条样式优化 --- */
        .layui-body::-webkit-scrollbar,
        .properties-panel::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .layui-body::-webkit-scrollbar-track,
        .properties-panel::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .layui-body::-webkit-scrollbar-thumb,
        .properties-panel::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        .layui-body::-webkit-scrollbar-thumb:hover,
        .properties-panel::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.13/layui.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/map/js/china.js"></script>
    <!-- Layui TreeTable 扩展 -->
    <script src="https://cdn.jsdelivr.net/npm/layui-treetable@1.5.5/treetable.js"></script>
    <script>
        layui.use(['element', 'form', 'layer', 'colorpicker', 'table', 'treeTable'], function () {
            var element = layui.element, form = layui.form, layer = layui.layer,
                colorpicker = layui.colorpicker, table = layui.table, treeTable = layui.treeTable, $ = layui.$;

            // 初始化折叠面板
            element.init('collapse');
            
            var chartInstances = {}, chartOptions = {}, widgetCounter = 0;
            var $canvas = $('#dashboard-canvas'), $canvasProps = $('#canvas-properties'),
                $componentProps = $('#component-properties'), $selectedWidget = null;
            
            // 组件复制和粘贴功能
            var clipboardWidget = null;
            
            function copyWidget() {
                if (!$selectedWidget) return;
                clipboardWidget = {
                    type: $selectedWidget.data('type'),
                    width: $selectedWidget.width(),
                    height: $selectedWidget.height(),
                    style: {
                        backgroundColor: $selectedWidget.css('background-color'),
                        borderRadius: $selectedWidget.css('border-radius'),
                        boxShadow: $selectedWidget.css('box-shadow')
                    }
                };
                
                // 获取特定组件的数据
                if (isBasicComponent($selectedWidget.data('type'))) {
                    var body = $selectedWidget.find('.chart-widget-body');
                    if ($selectedWidget.data('type') === 'label' || $selectedWidget.data('type') === 'button') {
                        clipboardWidget.textContent = body.text().trim();
                    } else if ($selectedWidget.data('type').includes('input') || $selectedWidget.data('type') === 'textarea') {
                        clipboardWidget.placeholder = body.find('input, textarea').attr('placeholder');
                    }
                } else if (isChartComponent($selectedWidget.data('type'))) {
                    clipboardWidget.chartOption = chartOptions[$selectedWidget.data('body-id')] || getChartOption($selectedWidget.data('type'));
                }
                
                layer.msg('组件已复制到剪贴板');
            }
            
            function pasteWidget() {
                if (!clipboardWidget) {
                    layer.msg('剪贴板为空');
                    return;
                }
                
                widgetCounter++;
                var widgetId = 'widget-' + widgetCounter;
                var bodyId = 'widget-body-' + widgetCounter;
                
                var newWidget = $('<div class="chart-widget" id="' + widgetId + '" data-type="' + clipboardWidget.type + '" data-body-id="' + bodyId + '"><div class="widget-delete-btn"><i class="fa-solid fa-xmark"></i></div><div class="chart-widget-body" id="' + bodyId + '"></div></div>');
                
                // 对于非基础组件且非地图和树形表格组件添加标题栏
                if (!isBasicComponent(clipboardWidget.type) && clipboardWidget.type !== 'map' && clipboardWidget.type !== 'tree-table') {
                    var componentTitle = $('.component-item[data-type="' + clipboardWidget.type + '"]').find('span').text();
                    newWidget.prepend('<div class="chart-widget-header">' + componentTitle + '</div>');
                }
                
                // 设置位置（在选中组件旁边）
                var left = 100, top = 100;
                if ($selectedWidget) {
                    left = parseInt($selectedWidget.css('left')) + 20;
                    top = parseInt($selectedWidget.css('top')) + 20;
                }
                
                newWidget.css({
                    left: left + 'px',
                    top: top + 'px',
                    width: clipboardWidget.width,
                    height: clipboardWidget.height,
                    backgroundColor: clipboardWidget.style.backgroundColor,
                    borderRadius: clipboardWidget.style.borderRadius,
                    boxShadow: clipboardWidget.style.boxShadow,
                    zIndex: widgetCounter
                });
                
                $canvas.append(newWidget);
                bindWidgetEvents(newWidget);
                
                // 渲染组件
                var customData = {};
                if (clipboardWidget.textContent) customData.textContent = clipboardWidget.textContent;
                if (clipboardWidget.placeholder) customData.placeholder = clipboardWidget.placeholder;
                if (clipboardWidget.chartOption) customData.chartOption = clipboardWidget.chartOption;
                
                renderComponent(bodyId, clipboardWidget.type, customData);
                showComponentProperties(newWidget);
                layer.msg('组件粘贴成功');
            }

            // --- 属性面板逻辑 ---
            function showCanvasProperties() {
                $canvasProps.show(); $componentProps.hide();
                if ($selectedWidget) { $selectedWidget.removeClass('selected'); $selectedWidget = null; }
            }

            function showComponentProperties($widget) {
                $canvasProps.hide(); $componentProps.show();
                $('.chart-widget').removeClass('selected');
                $widget.addClass('selected'); $selectedWidget = $widget;

                let formData = {
                    "x": parseInt($widget.css('left')), "y": parseInt($widget.css('top')),
                    "width": parseInt($widget.width()), "height": parseInt($widget.height()),
                    "borderRadius": parseInt($widget.css('border-radius')),
                    "boxShadow": $widget.css('box-shadow').replace(/rgba?\(0, 0, 0, 0\)\s(0px\s){2}0px/g, ''),
                    "rotate": $widget.data('rotate') || 0,
                    "opacity": Math.round(($widget.css('opacity') || 1) * 100),
                    "lockAspectRatio": $widget.data('lockAspectRatio') || false
                };

                $('#specific-properties-container').html(getSpecificPropertiesHTML($widget.data('type'), formData));
                form.val('component-style-form', formData);

                colorpicker.render({ elem: '#widgetBgColorPicker', predefine: true, color: $widget.css('backgroundColor'), done: function (color) { if ($selectedWidget) $selectedWidget.css('backgroundColor', color); } });
                
                // 渲染组件特定的颜色选择器
                var type = $widget.data('type');
                var body = $widget.find('.chart-widget-body');
                if (type === 'label') {
                    var textColor = body.find('.widget-label').css('color') || '#000000';
                    colorpicker.render({ 
                        elem: '#widgetTextColorPicker', 
                        predefine: true, 
                        color: textColor, 
                        done: function (color) { 
                            if ($selectedWidget) {
                                $selectedWidget.find('.widget-label').css('color', color);
                            }
                        } 
                    });
                }
                
                if (type === 'button') {
                    var btnColor = body.find('button').css('background-color') || '#1E9FFF';
                    colorpicker.render({ 
                        elem: '#widgetButtonColorPicker',

                $canvas.css({ width: formData.width + 'px', height: formData.height + 'px' });

            // --- 组件拖拽与创建 ---
            $(".component-item").draggable({ helper: 'clone', revert: 'invalid', appendTo: 'body', zIndex: 1002 });
            $canvas.droppable({
                accept: ".component-item",
                drop: function (event, ui) {
                    widgetCounter++;
                    var type = ui.draggable.data('type');
                    var widgetId = 'widget-' + widgetCounter, bodyId = 'widget-body-' + widgetCounter;

                    var newWidget = $(`<div class="chart-widget" id="${widgetId}" data-type="${type}" data-body-id="${bodyId}"><div class="widget-delete-btn"><i class="fa-solid fa-xmark"></i></div><div class="chart-widget-body" id="${bodyId}"></div></div>`);

                    // 对于非基础组件且非地图和树形表格组件添加标题栏
                    if (!isBasicComponent(type) && type !== 'map' && type !== 'tree-table') {
                        newWidget.prepend(`<div class="chart-widget-header">${ui.draggable.find('span').text()}</div>`);
                    }

                    // 计算组件在画布中的相对位置
                    var canvasOffset = $canvas.offset();
                    var canvasScrollLeft = $canvas.parent().scrollLeft();
                    var canvasScrollTop = $canvas.parent().scrollTop();
                    newWidget.css({ 
                        top: ui.offset.top - canvasOffset.top + canvasScrollTop, 
                        left: ui.offset.left - canvasOffset.left + canvasScrollLeft, 
                        zIndex: widgetCounter 
                    });
                    newWidget.css(getInitialSize(type));
                    $canvas.append(newWidget);

                    newWidget.draggable({
                        containment: '#dashboard-canvas',
                        helper: 'original',
                        appendTo: '#dashboard-canvas',
                        zIndex: 9999,
                        scroll: false,
                        refreshPositions: true,
                        start: function (e, ui) {
                            $(this).css('cursor', 'grabbing');
                        },
                        drag: function (e, ui) {
                            // 实时更新位置属性
                            $(this).css({
                                left: ui.position.left,
                                top: ui.position.top
                            });
                        },
                        stop: function (e, ui) {
                            $(this).css('cursor', 'default');
                            showComponentProperties($(this));
                        }
                    }).resizable({
                        containment: 'parent', minHeight: 30, minWidth: 50,
                        resize: (e, ui) => {
                            var chart = chartInstances[$(e.target).data('body-id')];
                            if (chart) chart.resize();
                            if ($(e.target).data('type').includes('table')) {
                                var bodyId = $(e.target).data('body-id');
                                renderComponent(bodyId, $(e.target).data('type'));
                            }
                        },
                        stop: (e, ui) => showComponentProperties($(e.target))
                    }).on('click', function (e) { e.stopPropagation(); showComponentProperties($(this)); });

                    newWidget.find('.widget-delete-btn').on('click', function (e) {
                        e.stopPropagation();
                        var bodyId = newWidget.data('body-id');
                        if (chartInstances[bodyId]) {
                            echarts.dispose(document.getElementById(bodyId));
                            delete chartInstances[bodyId];
                            delete chartOptions[bodyId];
                        }
                        newWidget.remove();
                        showCanvasProperties();
                    });

                    renderComponent(bodyId, type);
                    showComponentProperties(newWidget);
                }
            });

            // --- 组件渲染核心逻辑 ---
            function renderComponent(containerId, type, customData = {}) {
                var container = $('#' + containerId);
                if (isChartComponent(type)) {
                    if (chartInstances[containerId]) echarts.dispose(container[0]);
                    var myChart = echarts.init(container[0]);
                    // 使用自定义数据或默认数据
                    var option = customData.chartOption || getChartOption(type);
                    myChart.setOption(option);
                    chartInstances[containerId] = myChart;
                    chartOptions[containerId] = option;
                } else if (isBasicComponent(type)) {
                    container.html(getBasicComponentHTML(type, customData));
                    if (['radio', 'checkbox'].includes(type)) form.render();
                } else if (type === 'table') {
                    table.render({ elem: '#' + containerId, height: 'full-20', data: [{ p: '产品A', d: '华东', s: 120 }, { p: '产品B', d: '华南', s: 200 }], cols: [[{ field: 'p', title: '产品' }, { field: 'd', title: '地区' }, { field: 's', title: '销量' }]], skin: 'line' });
                } else if (type === 'tree-table') {
                    treeTable.render({
                        elem: '#' + containerId,
                        height: 'full-20',
                        tree: { iconPack: 'fa', isExpandAll: false },
                        cols: [
                            { key: 'id', title: 'ID', width: '80px' },

                            { "id": 4, "pid": 2, "name": "后端开发组", "budget": 2500 },
                            { "id": 5, "pid": 1, "name": "市场营销部", "budget": 3000 },
                            { "id": 6, "pid": 5, "name": "华南市场", "budget": 1200 },
                            { "id": 7, "pid": 5, "name": "华北市场", "budget": 1800 }
                        ]
                    });
                }
                
                // 应用自定义数据中的样式
                if (customData.fontSize && (type === 'label')) {
                    container.find('.widget-label').css('font-size', customData.fontSize);

                }
                
                if (customData.buttonColor && (type === 'button')) {
                    container.find('button').css('background-color', customData.buttonColor);
                }
                
                if ((type.includes('input') || type === 'textarea') && customData.fontSize) {
                    container.find('input, textarea').css('font-size', customData.fontSize);
                }

                    container.find('input, textarea').css('color', customData.color);

            // --- 属性面板动态更新画布 ---
            form.on('input(component-style-form)', function (data) {
                if (!$selectedWidget) return;
                var field = data.elem.name, value = data.value;
                var type = $selectedWidget.data('type');

                switch (field) {
                    case 'x': $selectedWidget.css('left', value + 'px'); break;
                    case 'y': $selectedWidget.css('top', value + 'px'); break;
                    case 'width': 
                        $selectedWidget.width(value);
                        // 如果锁定宽高比，则同时调整高度
                        if ($selectedWidget.data('lockAspectRatio')) {
                            var aspectRatio = $selectedWidget.data('aspectRatio') || 1;
                            var newHeight = Math.round(value / aspectRatio);
                            $selectedWidget.height(newHeight);
                            $('input[name="height"]').val(newHeight);
                        }
                        break;
                    case 'height': 
                        $selectedWidget.height(value);
                        // 如果锁定宽比，则同时调整宽度
                        if ($selectedWidget.data('lockAspectRatio')) {
                            var aspectRatio = $selectedWidget.data('aspectRatio') || 1;
                            var newWidth = Math.round(value * aspectRatio);
                            $selectedWidget.width(newWidth);
                            $('input[name="width"]').val(newWidth);
                        }
                        break;
                    case 'rotate': 
                        $selectedWidget.data('rotate', value);
                        $selectedWidget.css('transform', 'rotate(' + value + 'deg)');
                        break;
                    case 'opacity': 
                        $selectedWidget.css('opacity', value / 100);
                        break;
                    case 'borderRadius': $selectedWidget.css('border-radius', value + 'px'); break;
                    case 'boxShadow': $selectedWidget.css('box-shadow', value); break;
                    case 'textContent':
                        if (type === 'label') $selectedWidget.find('.widget-label').text(value);
                        if (type === 'button') $selectedWidget.find('button').text(value);
                        break;
                    case 'placeholder':
                        $selectedWidget.find('input, textarea').attr('placeholder', value);
                        break;
                    case 'fontSize':
                        if (type === 'label') $selectedWidget.find('.widget-label').css('font-size', value + 'px');
                        break;
                    case 'inputFontSize':
                        $selectedWidget.find('input, textarea').css('font-size', value + 'px');
                        break;
                }
                if (['width', 'height'].includes(field)) {
                    var chartId = $selectedWidget.data('body-id');
                    if (chartInstances[chartId]) chartInstances[chartId].resize();
                    if (type.includes('table')) renderComponent(chartId, type);
                }
            });
            
            // 监听锁定宽高比开关
            form.on('switch(component-style-form)', function(data) {
                if (!$selectedWidget) return;
                var isChecked = data.elem.checked;
                $selectedWidget.data('lockAspectRatio', isChecked);
                
                // 如果开启锁定宽高比，保存当前宽高比
                if (isChecked) {
                    var width = parseInt($selectedWidget.width());
                    var height = parseInt($selectedWidget.height());
                    var aspectRatio = width / height;
                    $selectedWidget.data('aspectRatio', aspectRatio);
                }
            });
            
            // 监听组件特定配置
            form.on('input(component-style-form)', function(data) {
                if (!$selectedWidget) return;
                var field = data.elem.name, value = data.value;
                var type = $selectedWidget.data('type');
                var body = $selectedWidget.find('.chart-widget-body');
                
                switch (field) {
                    case 'fontSize':
                        if (type === 'label') {
                            body.find('.widget-label').css('font-size', value + 'px');
                        }
                        break;
                    case 'inputFontSize':
                        if (type.includes('input') || type === 'textarea') {
                            body.find('input, textarea').css('font-size', value + 'px');
                        }
                        break;
                }
            });
            
            form.on('switch(component-style-form)', function(data) {
                if (!$selectedWidget) return;
                var field = data.elem.name;
                var isChecked = data.elem.checked;
                var type = $selectedWidget.data('type');
                
                switch (field) {
                    case 'showLegend':
                        // 图例显示/隐藏逻辑
                        var chartId = $selectedWidget.data('body-id');
                        if (chartInstances[chartId]) {
                            var option = chartInstances[chartId].getOption();
                            option.legend = option.legend || {};
                            option.legend.show = isChecked;
                            chartInstances[chartId].setOption(option, true);
                        }
                        break;
                    case 'enableAnimation':
                        // 动画开启/关闭逻辑
                        var chartId = $selectedWidget.data('body-id');
                        if (chartInstances[chartId]) {
                            var option = chartInstances[chartId].getOption();
                            option.animation = isChecked;
                            chartInstances[chartId].setOption(option, true);
                        }
                        break;
                }
            });

            // --- 图层调整 ---
            $('#btn-bring-to-front, #btn-send-to-back').on('click', function () {
                if (!$selectedWidget) return;
                var isFront = $(this).attr('id') === 'btn-bring-to-front';
                var zIndexes = $('.chart-widget').map(function () { return parseInt($(this).css('z-index')) || 0; }).get();
                if (isFront) {
                    $selectedWidget.css('z-index', Math.max.apply(null, zIndexes.length ? zIndexes : [0]) + 1);
                } else {
                    $selectedWidget.css('z-index', Math.min.apply(null, zIndexes.length ? zIndexes : [0]) - 1);
                }
            });

            // --- 保存和加载功能 ---
            function saveDashboard() {
                var dashboardData = {
                    canvas: {
                        width: $canvas.width(),
                        height: $canvas.height(),
                        backgroundColor: $canvas.css('background-color')
                    },
                    widgets: []
                };

                $('.chart-widget').each(function () {
                    var $widget = $(this);
                    var widgetData = {
                        id: $widget.attr('id'),
                        type: $widget.data('type'),
                        bodyId: $widget.data('body-id'),
                        position: {
                            left: parseInt($widget.css('left')),
                            top: parseInt($widget.css('top'))
                        },
                        size: {
                            width: parseInt($widget.width()),
                            height: parseInt($widget.height())
                        },
                        style: {
                            backgroundColor: $widget.css('background-color'),
                            borderRadius: $widget.css('border-radius'),
                            boxShadow: $widget.css('box-shadow'),
                            opacity: $widget.css('opacity') || 1,
                            transform: $widget.css('transform') || 'none'
                        },
                        // 保存新增的属性
                        rotate: $widget.data('rotate') || 0,
                        lockAspectRatio: $widget.data('lockAspectRatio') || false,
                        aspectRatio: $widget.data('aspectRatio') || 1
                    };

                    // 获取特定组件的数据
                    if (isBasicComponent($widget.data('type'))) {
                        var body = $widget.find('.chart-widget-body');
                        if ($widget.data('type') === 'label' || $widget.data('type') === 'button') {
                            widgetData.customData = { textContent: body.text().trim() };
                            
                            // 保存标签和按钮的额外属性
                            if ($widget.data('type') === 'label') {
                                widgetData.customData.fontSize = body.find('.widget-label').css('font-size');
                                widgetData.customData.color = body.find('.widget-label').css('color');
                            }
                            
                            if ($widget.data('type') === 'button') {
                                widgetData.customData.buttonColor = body.find('button').css('background-color');
                            }
                        } else if ($widget.data('type').includes('input') || $widget.data('type') === 'textarea') {
                            widgetData.customData = { placeholder: body.find('input, textarea').attr('placeholder') };
                            
                            // 保存输入框的额外属性
                            widgetData.customData.fontSize = body.find('input, textarea').css('font-size');
                            widgetData.customData.color = body.find('input, textarea').css('color');
                        }
                    } else if (isChartComponent($widget.data('type'))) {
                        widgetData.customData = { chartOption: chartOptions[$widget.data('body-id')] };
                    }

                    dashboardData.widgets.push(widgetData);
                });

                // 保存到本地存储
                localStorage.setItem('luminaDashboard', JSON.stringify(dashboardData));
                layer.msg('保存成功');
            }

            function loadDashboard() {
                var savedData = localStorage.getItem('luminaDashboard');
                if (!savedData) {
                    layer.msg('没有找到保存的数据');
                    return;
                }

                try {
                    var dashboardData = JSON.parse(savedData);

                    // 清空当前画布
                    $('.chart-widget').remove();
                    for (var id in chartInstances) {
                        echarts.dispose(document.getElementById(id));
                    }
                    chartInstances = {};
                    chartOptions = {};
                    widgetCounter = 0;

                    // 恢复画布属性
                    $canvas.css({
                        width: dashboardData.canvas.width,
                        height: dashboardData.canvas.height,
                        backgroundColor: dashboardData.canvas.backgroundColor
                    });
                    $('input[name="width"]').val(dashboardData.canvas.width);
                    $('input[name="height"]').val(dashboardData.canvas.height);

                    // 恢复组件
                    dashboardData.widgets.forEach(function (widgetData) {
                        widgetCounter++;
                        var newWidget = $(`<div class="chart-widget" id="${widgetData.id}" data-type="${widgetData.type}" data-body-id="${widgetData.bodyId}"><div class="widget-delete-btn"><i class="fa-solid fa-xmark"></i></div><div class="chart-widget-body" id="${widgetData.bodyId}"></div></div>`);

                        // 对于非基础组件且非地图和树形表格组件添加标题栏
                        if (!isBasicComponent(widgetData.type) && widgetData.type !== 'map' && widgetData.type !== 'tree-table') {
                            var componentTitle = $('.component-item[data-type="' + widgetData.type + '"]').find('span').text();
                            newWidget.prepend(`<div class="chart-widget-header">${componentTitle}</div>`);
                        }

                        newWidget.css({
                            left: widgetData.position.left,
                            top: widgetData.position.top,
                            width: widgetData.size.width,
                            height: widgetData.size.height,
                            backgroundColor: widgetData.style.backgroundColor,
                            borderRadius: widgetData.style.borderRadius,
                            boxShadow: widgetData.style.boxShadow,
                            opacity: widgetData.style.opacity,
                            transform: widgetData.style.transform
                        });
                        
                        // 恢复新增的属性
                        newWidget.data('rotate', widgetData.rotate || 0);
                        newWidget.data('lockAspectRatio', widgetData.lockAspectRatio || false);
                        newWidget.data('aspectRatio', widgetData.aspectRatio || 1);

                        $canvas.append(newWidget);
                        bindWidgetEvents(newWidget);
                        renderComponent(widgetData.bodyId, widgetData.type, widgetData.customData || {});
                    });

                    layer.msg('加载成功');
                } catch (e) {
                    layer.msg('加载失败：' + e.message);
                }
            }

            // --- 绑定组件事件 ---
            function bindWidgetEvents($widget) {
                $widget.draggable({
                    containment: '#dashboard-canvas',
                    helper: 'original',
                    appendTo: '#dashboard-canvas',
                    zIndex: 9999,
                    scroll: false,
                    refreshPositions: true,
                    start: function (e, ui) {
                        $(this).css('cursor', 'grabbing');
                    },
                    drag: function (e, ui) {
                        // 实时更新位置属性
                        $(this).css({
                            left: ui.position.left,
                            top: ui.position.top
                        });
                    },
                    stop: function (e, ui) {
                        $(this).css('cursor', 'default');
                        showComponentProperties($(this));
                    }
                }).resizable({
                    containment: 'parent', minHeight: 30, minWidth: 50,
                    resize: (e, ui) => {
                        var chart = chartInstances[$(e.target).data('body-id')];
                        if (chart) chart.resize();
                        if ($(e.target).data('type').includes('table')) {
                            var bodyId = $(e.target).data('body-id');
                            renderComponent(bodyId, $(e.target).data('type'));
                        }
                    },
                    stop: (e, ui) => showComponentProperties($(e.target))
                }).on('click', function (e) {
                    e.stopPropagation();
                    showComponentProperties($(this));
                });

                $widget.find('.widget-delete-btn').on('click', function (e) {
                    e.stopPropagation();
                    var bodyId = $widget.data('body-id');
                    if (chartInstances[bodyId]) {
                        echarts.dispose(document.getElementById(bodyId));
                        delete chartInstances[bodyId];
                        delete chartOptions[bodyId];
                    }
                    $widget.remove();
                    showCanvasProperties();
                });
            }

            // --- 画布缩放功能 ---
            var canvasScale = 1;
            var isDraggingCanvas = false;
            var lastX, lastY;

            $('#btn-zoom-in').on('click', function() {
                if (canvasScale < 2) { 
                    canvasScale += 0.1; 
                    updateCanvasScale(); 
                } 
            });
            
            $('#btn-zoom-out').on('click', function() {
                if (canvasScale > 0.5) {
                    canvasScale -= 0.1;
                    updateCanvasScale();
                }
            });
            
            $('#btn-zoom-reset').on('click', function() {
                canvasScale = 1;
                updateCanvasScale();
            });
            
            function updateCanvasScale() {
                $canvas.css({
                    transform: 'scale(' + canvasScale + ')',
                    transformOrigin: 'top left'
                });
                $('#zoom-level').text(Math.round(canvasScale * 100) + '%');
                
                // 重新计算所有组件的位置约束
                $('.chart-widget').each(function() {
                    $(this).draggable('option', 'containment', '#dashboard-canvas');
                });
            }
            
            // 画布拖拽查看
            $canvas.on('mousedown', function(e) {
                if (e.ctrlKey || e.metaKey) { // Ctrl 或 Cmd 键按下时启用拖拽
                    isDraggingCanvas = true;
                    lastX = e.clientX;
                    lastY = e.clientY;
                    $canvas.css('cursor', 'grabbing');
                    e.preventDefault();
                }
            });
            
            $(document).on('mousemove', function(e) {
                if (isDraggingCanvas) {
                    var deltaX = e.clientX - lastX;
                    var deltaY = e.clientY - lastY;
                    $canvas.parent().scrollLeft($canvas.parent().scrollLeft() - deltaX);
                    $canvas.parent().scrollTop($canvas.parent().scrollTop() - deltaY);
                    lastX = e.clientX;
                    lastY = e.clientY;
                }
            });
            
            $(document).on('mouseup', function() {
                isDraggingCanvas = false;
                $canvas.css('cursor', 'default');
            });

            // --- 辅助函数 ---
            function isBasicComponent(type) { 
                return ['label', 'text-input', 'textarea', 'radio', 'checkbox', 'button'].includes(type); 
            }
            
            function isChartComponent(type) { 
                return ['pie', 'bar', 'line', 'funnel', 'radar', 'gauge', 'scatter', 'candlestick', 'map'].includes(type); 
            }
            
            function updateChartTheme($widget, color) {
                var chartId = $widget.data('body-id');
                if (chartInstances[chartId]) {
                    var option = chartInstances[chartId].getOption();
                    
                    // 更新图表系列颜色
                    if (option.series) {
                        for (var i = 0; i < option.series.length; i++) {
                            if (option.series[i].itemStyle) {
                                option.series[i].itemStyle.color = color;
                            } else {
                                option.series[i].itemStyle = { color: color };
                            }
                            
                            // 特殊处理某些图表类型
                            if (option.series[i].type === 'line') {
                                option.series[i].lineStyle = { color: color };
                            }
                            
                            if (option.series[i].type === 'bar') {
                                option.series[i].itemStyle.color = color;
                            }
                        }
                    }
                    
                    // 更新图表其他颜色相关属性
                    if (option.color) {
                        option.color[0] = color;
                    }
                    
                    chartInstances[chartId].setOption(option, true);
                }
            }

                }
                // Ctrl+C 复制
                else if (e.ctrlKey && e.keyCode === 67) {
                    e.preventDefault();
                    copyWidget();
                }
                // Ctrl+V 粘贴
                else if (e.ctrlKey && e.keyCode === 86) {
                    e.preventDefault();
                    pasteWidget();
                }
                // Delete 删除选中组件
                else if (e.keyCode === 46 && $selectedWidget) {
                    $selectedWidget.find('.widget-delete-btn').click();
                }
                // Esc 取消选中
                else if (e.keyCode === 27) {
                    showCanvasProperties();
                }
            });

            // --- 初始化 ---
            showCanvasProperties();
            
            // 添加事件监听器
            $('#btn-save').on('click', function () {
                saveDashboard();
            });
            $('#btn-load').on('click', function () {
                loadDashboard();
            });
            $('#btn-export').on('click', function () {
                exportDashboard();
            });
            $('#btn-preview').on('click', function () {
                previewDashboard();
            });
            $('#btn-help').on('click', function () {
                showHelp();
            });
        });
    </script>
</body>

</html>
